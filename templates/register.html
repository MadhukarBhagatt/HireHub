<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - HireHub</title>


    <!-- BOOTSTRAP -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- HIREHUB CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">


    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            display: flex;
            align-items: center;
        }


        .register-card {
            border: none;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }


        .register-header {
            text-align: center;
            padding-bottom: 15px;
        }


        .register-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }


        .register-title {
            font-weight: bold;
            color: #1f2937;
        }


        .form-control,
        .form-select {
            padding: 12px;
            border-radius: 8px;
        }


        .form-control:focus,
        .form-select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15);
        }


        .register-btn {
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
        }


        .back-home {
            text-decoration: none;
            font-size: 14px;
        }


        .back-home:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="row justify-content-center">

        <div class="col-sm-10 col-md-8 col-lg-6">


            <!-- REGISTER CARD -->

            <div class="card register-card">

                <div class="card-body p-4 p-md-5">


                    <!-- HEADER -->

                    <div class="register-header">

                        <div class="register-icon">

                            🚀

                        </div>


                        <h2 class="register-title">

                            Create Your Account

                        </h2>


                        <p class="text-muted mb-0">

                            Join HireHub and start your journey today

                        </p>

                    </div>


                    <!-- FLASH MESSAGES -->

                    {% with messages = get_flashed_messages(with_categories=true) %}

                        {% if messages %}

                            {% for category, message in messages %}

                                <div class="alert alert-{{ category }}">

                                    {{ message }}

                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}


                    <!-- REGISTER FORM -->

                    <form method="POST"
                          action="{{ url_for('register') }}">


                        <!-- NAME -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">

                                👤 Full Name

                            </label>


                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                placeholder="Enter your full name"
                                required>

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">

                                📧 Email Address

                            </label>


                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required>

                        </div>


                        <!-- PASSWORD -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">

                                🔒 Password

                            </label>


                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Create a password"
                                required>

                        </div>


                        <!-- ROLE -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">

                                👥 Register As

                            </label>


                            <select
                                name="role"
                                class="form-select"
                                required>

                                <option value="">

                                    -- Select Your Role --

                                </option>


                                <option value="freelancer">

                                    👨‍💻 Freelancer

                                </option>


                                <option value="client">

                                    🏢 Client

                                </option>

                            </select>

                        </div>


                        <!-- REGISTER BUTTON -->

                        <button
                            type="submit"
                            class="btn btn-primary register-btn w-100">

                            Create Account →

                        </button>


                    </form>


                    <!-- LOGIN LINK -->

                    <p class="text-center mt-4 mb-2">

                        Already have an account?

                        <a
                            href="{{ url_for('login') }}"
                            class="fw-bold text-decoration-none">

                            Login Here

                        </a>

                    </p>


                    <!-- HOME LINK -->

                    <div class="text-center">

                        <a
                            href="{{ url_for('home') }}"
                            class="back-home text-muted">

                            ← Back to Home

                        </a>

                    </div>


                </div>

            </div>


        </div>

    </div>

</div>


</body>

</html>
