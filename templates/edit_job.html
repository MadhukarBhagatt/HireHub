<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Job - HireHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="{{ url_for('dashboard') }}">

            HireHub

        </a>


        <div>

            <a
                href="{{ url_for('dashboard') }}"
                class="btn btn-outline-light me-2">

                Dashboard

            </a>


            <a
                href="{{ url_for('logout') }}"
                class="btn btn-danger">

                Logout

            </a>

        </div>

    </div>

</nav>



<!-- EDIT JOB FORM -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">


                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">

                        ✏️ Edit Job

                    </h3>

                </div>


                <div class="card-body">


                    <form method="POST">


                        <!-- JOB TITLE -->

                        <div class="mb-3">

                            <label class="form-label">

                                Job Title

                            </label>


                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                value="{{ job.title }}"
                                required>

                        </div>



                        <!-- JOB CATEGORY -->

                        <div class="mb-3">

                            <label class="form-label">

                                Job Category

                            </label>


                            <select
                                name="category"
                                class="form-select"
                                required>


                                <option value="Web Development"
                                    {% if job.category == "Web Development" %}selected{% endif %}>

                                    Web Development

                                </option>


                                <option value="Mobile Development"
                                    {% if job.category == "Mobile Development" %}selected{% endif %}>

                                    Mobile Development

                                </option>


                                <option value="Graphic Design"
                                    {% if job.category == "Graphic Design" %}selected{% endif %}>

                                    Graphic Design

                                </option>


                                <option value="UI/UX Design"
                                    {% if job.category == "UI/UX Design" %}selected{% endif %}>

                                    UI/UX Design

                                </option>


                                <option value="Content Writing"
                                    {% if job.category == "Content Writing" %}selected{% endif %}>

                                    Content Writing

                                </option>


                                <option value="Digital Marketing"
                                    {% if job.category == "Digital Marketing" %}selected{% endif %}>

                                    Digital Marketing

                                </option>


                                <option value="Data Entry"
                                    {% if job.category == "Data Entry" %}selected{% endif %}>

                                    Data Entry

                                </option>


                                <option value="Data Analysis"
                                    {% if job.category == "Data Analysis" %}selected{% endif %}>

                                    Data Analysis

                                </option>


                                <option value="Video Editing"
                                    {% if job.category == "Video Editing" %}selected{% endif %}>

                                    Video Editing

                                </option>


                                <option value="Other"
                                    {% if job.category == "Other" %}selected{% endif %}>

                                    Other

                                </option>


                            </select>

                        </div>



                        <!-- DESCRIPTION -->

                        <div class="mb-3">

                            <label class="form-label">

                                Job Description

                            </label>


                            <textarea
                                name="description"
                                class="form-control"
                                rows="5"
                                required>{{ job.description }}</textarea>

                        </div>



                        <!-- SKILLS -->

                        <div class="mb-3">

                            <label class="form-label">

                                Required Skills

                            </label>


                            <input
                                type="text"
                                name="skills"
                                class="form-control"
                                value="{{ job.skills }}"
                                required>

                        </div>



                        <!-- BUDGET -->

                        <div class="mb-3">

                            <label class="form-label">

                                Budget (₹)

                            </label>


                            <input
                                type="number"
                                name="budget"
                                class="form-control"
                                value="{{ job.budget }}"
                                min="1"
                                step="0.01"
                                required>

                        </div>



                        <!-- DEADLINE -->

                        <div class="mb-4">

                            <label class="form-label">

                                Deadline

                            </label>


                            <input
                                type="date"
                                name="deadline"
                                class="form-control"
                                value="{{ job.deadline }}"
                                required>

                        </div>



                        <!-- BUTTONS -->

                        <div class="d-flex gap-2">


                            <button
                                type="submit"
                                class="btn btn-primary">

                                💾 Update Job

                            </button>


                            <a
                                href="{{ url_for('dashboard') }}"
                                class="btn btn-secondary">

                                Cancel

                            </a>


                        </div>


                    </form>


                </div>


            </div>


        </div>


    </div>


</div>


</body>

</html>
