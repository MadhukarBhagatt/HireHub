<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - HireHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            display: flex;
            align-items: center;
        }


        .login-card {
            border: none;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }


        .login-header {
            text-align: center;
            padding: 10px 0 20px;
        }


        .login-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }


        .login-title {
            font-weight: bold;
            color: #1f2937;
        }


        .form-control {
            padding: 12px;
            border-radius: 8px;
        }


        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15);
        }


        .login-btn {
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
        }


        .back-home {
            text-decoration: none;
            font-size: 14px;
        }


        .back-home:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="row justify-content-center">

        <div class="col-sm-10 col-md-7 col-lg-5">


            <div class="card login-card">

                <div class="card-body p-4 p-md-5">


                    <!-- LOGIN HEADER -->

                    <div class="login-header">


                        <div class="login-icon">

                            💼

                        </div>


                        <h2 class="login-title">

                            Welcome Back

                        </h2>


                        <p class="text-muted mb-0">

                            Login to continue to HireHub

                        </p>


                    </div>


                    <!-- FLASH MESSAGES -->

                    {% with messages = get_flashed_messages(with_categories=true) %}

                        {% if messages %}

                            {% for category, message in messages %}

                                <div class="alert alert-{{ category }}">

                                    {{ message }}

                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}


                    <!-- LOGIN FORM -->

                    <form method="POST"
                          action="{{ url_for('login') }}">


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">

                                📧 Email Address

                            </label>


                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required>

                        </div>


                        <!-- PASSWORD -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">

                                🔒 Password

                            </label>


                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter your password"
                                required>

                        </div>


                        <!-- LOGIN BUTTON -->

                        <button
                            type="submit"
                            class="btn btn-primary login-btn w-100">

                            Login →

                        </button>


                    </form>


                    <!-- REGISTER LINK -->

                    <p class="text-center mt-4 mb-2">

                        Don't have an account?

                        <a
                            href="{{ url_for('register') }}"
                            class="fw-bold text-decoration-none">

                            Create Account

                        </a>

                    </p>


                    <!-- HOME LINK -->

                    <div class="text-center">

                        <a
                            href="{{ url_for('home') }}"
                            class="back-home text-muted">

                            ← Back to Home

                        </a>

                    </div>


                </div>

            </div>


        </div>

    </div>

</div>


</body>

</html>
