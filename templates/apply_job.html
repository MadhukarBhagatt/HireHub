<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply for Job - HireHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            HireHub
        </a>

        <a href="/dashboard"
           class="btn btn-outline-light">

            Dashboard

        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h3>
                        Apply for Job
                    </h3>

                </div>


                <div class="card-body">

                    <h4>
                        {{ job.title }}
                    </h4>

                    <p>
                        {{ job.description }}
                    </p>

                    <p>

                        <strong>
                            Required Skills:
                        </strong>

                        {{ job.skills }}

                    </p>

                    <p>

                        <strong>
                            Budget:
                        </strong>

                        ₹{{ job.budget }}

                    </p>

                    <hr>


                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Cover Letter

                            </label>

                            <textarea
                                name="cover_letter"
                                class="form-control"
                                rows="6"
                                placeholder="Write why you are suitable for this job..."
                                required></textarea>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success">

                            🚀 Submit Application

                        </button>


                        <a
                            href="/dashboard"
                            class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
