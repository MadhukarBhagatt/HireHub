<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile - HireHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="{{ url_for('dashboard') }}">

            HireHub

        </a>


        <div>

            <a
                href="{{ url_for('dashboard') }}"
                class="btn btn-outline-light me-2">

                Dashboard

            </a>


            <a
                href="{{ url_for('logout') }}"
                class="btn btn-danger">

                Logout

            </a>

        </div>

    </div>

</nav>


<!-- MAIN CONTENT -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="mb-4">

                        👤 My Freelancer Profile

                    </h2>


                    <!-- FLASH MESSAGES -->

                    {% with messages = get_flashed_messages(with_categories=true) %}

                        {% if messages %}

                            {% for category, message in messages %}

                                <div class="alert alert-{{ category }}">

                                    {{ message }}

                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}


                    <!-- PROFILE FORM -->

                    <form method="POST">


                        <!-- BIO -->

                        <div class="mb-3">

                            <label class="form-label">

                                About Me

                            </label>

                            <textarea
                                name="bio"
                                class="form-control"
                                rows="5"
                                placeholder="Tell clients about yourself...">{{ profile.bio if profile else '' }}</textarea>

                        </div>


                        <!-- SKILLS -->

                        <div class="mb-3">

                            <label class="form-label">

                                Skills

                            </label>

                            <input
                                type="text"
                                name="skills"
                                class="form-control"
                                value="{{ profile.skills if profile else '' }}"
                                placeholder="Example: Python, Flask, HTML, CSS">


                        </div>


                        <!-- EXPERIENCE -->

                        <div class="mb-4">

                            <label class="form-label">

                                Experience (Years)

                            </label>

                            <input
                                type="number"
                                name="experience"
                                min="0"
                                class="form-control"
                                value="{{ profile.experience if profile else 0 }}">

                        </div>


                        <!-- BUTTONS -->

                        <button
                            type="submit"
                            class="btn btn-primary">

                            💾 Save Profile

                        </button>


                        <a
                            href="{{ url_for('dashboard') }}"
                            class="btn btn-secondary">

                            Back to Dashboard

                        </a>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
