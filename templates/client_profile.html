<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Client Profile - HireHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="{{ url_for('dashboard') }}">

            HireHub

        </a>


        <a
            href="{{ url_for('logout') }}"
            class="btn btn-danger">

            Logout

        </a>

    </div>

</nav>



<!-- MAIN CONTENT -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">


            <div class="card shadow">

                <div class="card-body p-4">


                    <h2 class="mb-4">

                        🏢 My Client Profile

                    </h2>



                    <!-- FLASH MESSAGES -->

                    {% with messages = get_flashed_messages(with_categories=true) %}

                        {% if messages %}

                            {% for category, message in messages %}

                                <div class="alert alert-{{ category }}">

                                    {{ message }}

                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}



                    <!-- PROFILE FORM -->

                    <form method="POST">


                        <!-- COMPANY NAME -->

                        <div class="mb-3">

                            <label class="form-label">

                                Company Name

                            </label>

                            <input
                                type="text"
                                name="company_name"
                                class="form-control"
                                value="{{ profile.company_name if profile else '' }}"
                                placeholder="Enter your company name">

                        </div>



                        <!-- ABOUT COMPANY -->

                        <div class="mb-3">

                            <label class="form-label">

                                About Company

                            </label>

                            <textarea
                                name="bio"
                                class="form-control"
                                rows="5"
                                placeholder="Tell freelancers about your company...">{{ profile.bio if profile else '' }}</textarea>

                        </div>



                        <!-- WEBSITE -->

                        <div class="mb-3">

                            <label class="form-label">

                                Website

                            </label>

                            <input
                                type="url"
                                name="website"
                                class="form-control"
                                value="{{ profile.website if profile else '' }}"
                                placeholder="https://example.com">

                        </div>



                        <!-- PHONE -->

                        <div class="mb-4">

                            <label class="form-label">

                                Phone Number

                            </label>

                            <input
                                type="text"
                                name="phone"
                                class="form-control"
                                value="{{ profile.phone if profile else '' }}"
                                placeholder="Enter phone number">

                        </div>



                        <!-- BUTTONS -->

                        <button
                            type="submit"
                            class="btn btn-primary">

                            💾 Save Profile

                        </button>


                        <a
                            href="{{ url_for('dashboard') }}"
                            class="btn btn-secondary">

                            Back

                        </a>


                    </form>


                </div>

            </div>


        </div>

    </div>

</div>


</body>

</html>
