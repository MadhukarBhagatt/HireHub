<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Freelancer - HireHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #0d6efd;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .contact-box {
            max-width: 600px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .contact-box h1 {
            color: #0d6efd;
            margin-bottom: 30px;
        }

        .email-box {
            background-color: #f1f3f5;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="/">
                HireHub
            </a>
        </div>
    </nav>


    <div class="container">

        <div class="contact-box">

            <h1>Contact Freelancer</h1>

            <h3>
                {{ freelancer.name }}
            </h3>

            <p>
                <strong>Role:</strong>
                {{ freelancer.role }}
            </p>

            <div class="email-box">

                <strong>Email:</strong><br>

                {{ freelancer.email }}

            </div>

            <a href="mailto:{{ freelancer.email }}"
               class="btn btn-primary">
                Send Email
            </a>

            <a href="/find-freelancer"
               class="btn btn-secondary">
                Back to Freelancers
            </a>

        </div>

    </div>

</body>

</html>
