<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Apply for Job - HireHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            HireHub
        </a>

        <a
            href="/jobs"
            class="btn btn-outline-light">

            Back to Jobs

        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="mb-4">
                Apply for Job
            </h2>


            <h4>
                {{ job.title }}
            </h4>

            <hr>


            <p>
                <strong>Description:</strong>
            </p>

            <p>
                {{ job.description }}
            </p>


            <p>
                <strong>Skills:</strong>
                {{ job.skills }}
            </p>


            <p>
                <strong>Budget:</strong>
                ₹{{ job.budget }}
            </p>


            <p>
                <strong>Deadline:</strong>
                {{ job.deadline }}
            </p>


            <hr>


            <form
                action="/apply/{{ job.id }}"
                method="POST">


                <div class="mb-3">

                    <label
                        for="cover_letter"
                        class="form-label">

                        <strong>
                            Write a Cover Letter
                        </strong>

                    </label>

                    <textarea
                        name="cover_letter"
                        id="cover_letter"
                        class="form-control"
                        rows="7"
                        placeholder="Write why you are suitable for this job..."
                        required></textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-success">

                    Submit Application

                </button>


                <a
                    href="/jobs"
                    class="btn btn-secondary ms-2">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
